<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iglesia & Jóvenes</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">

<style>
body{
margin:0;font-family:'Poppins',sans-serif;
background:linear-gradient(180deg,#ffffff,#1b24335f);
color:#244180}

/* NAV */
nav{
  position:fixed;
  top:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 20px;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(10px);
  z-index:1000;
}

.logo{font-weight:800;color:#d7d7e4}

/* OVERLAY */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(5px);
  opacity:0;
  pointer-events:none;
  transition:0.3s;
  z-index:1500;
}

.overlay.active{
  opacity:1;
  pointer-events:auto;
}

/* MENU */
.menu{
  position:fixed;
  top:0;
  right:0;
  width:100%;
  height:100vh;
   backdrop-filter:blur(5px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:20px;
  transform:translateX(100%);
  transition:0.4s ease;
  z-index:2000;
}

.menu a{
  color:#fff;
  text-decoration:none;
  font-size:1.5rem;
}

/* BOTON CERRAR */
.close-btn{
  position:absolute;
  top:20px;
  left:20px;
  font-size:2rem;
  cursor:pointer;
  color:#FF6D29;
  color:#fff;
  text-decoration:none;
  font-size:1.5rem;
}

.menu.active{
  transform:translateX(0);
}

.hamburger{
  font-size:1.8rem;
  cursor:pointer;
  margin-right: 40px;
}

section{padding:80px 20px;opacity:0;transform:translateY(40px);transition:0.8s ease}
section.visible{opacity:1;transform:translateY(0)}

.hero{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;/*background:radial-gradient(circle,#ffffff,#1b24335f)*/}
.hero h1{font-size:3rem}

.btn{background:#244180;border:none;padding:12px 20px;border-radius:25px;margin:10px;color:#fff;font-weight:600;cursor:pointer}
.btn:hover{ background-color: #802424; }

.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.gallery img{width:100%;border-radius:10px}

.maps iframe{width:100%;height:300px;border:none;border-radius:10px;margin-bottom:15px}

.socials{display:flex;justify-content:center;gap:15px}
.socials a{text-decoration:none;color:#FF6D29;font-weight:600}
</style>
</head>

<body>

<!-- NAV -->
<nav>
  <div class="logo">Fcp.</div>
  <div class="hamburger" onclick="toggleMenu()">☰</div>
</nav>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<!-- MENU -->
<div class="menu" id="menu">
  <div class="close-btn" onclick="toggleMenu()">✕</div>
  <a href="#hero" onclick="toggleMenu()">Inicio</a>
  <a href="#mapas" onclick="toggleMenu()">Ubicación</a>
  <a href="#galeria" onclick="toggleMenu()">Galería</a>
  <a href="#redes" onclick="toggleMenu()">Redes</a>
</div>

<!-- HERO -->
<section id="hero" class="hero visible">
  <h1>Bienvenido</h1>
  <p>Iglesia Familias con proposito.</p>
  <a class="btn" href="Matrimonios.html">Reuniónes de Matrimonios</a>
  <button class="btn" onclick="whatsapp('1234567890')">Reuniónes de Jóvenes</button>
  <button class="btn" onclick="whatsapp('1234567890')">Reuniónes de Mujeres</button>
  <button class="btn" onclick="whatsapp('1234567890')">Reuniónes de Hombres</button>
</section>

<!-- MAPAS -->
<section id="mapas">
  <h2>Ubicación</h2>
  <div class="maps">
    <iframe src="https://www.google.com/maps?q=Ciudad+Juarez&output=embed"></iframe>
    <iframe src="https://www.google.com/maps?q=Chihuahua&output=embed"></iframe>
  </div>
</section>

<!-- GALERIA -->
<section id="galeria">
  <h2>Galería</h2>
  <div class="gallery">
    <img src="https://picsum.photos/300/200?1">
    <img src="https://picsum.photos/300/200?2">
    <img src="https://picsum.photos/300/200?3">
    <img src="https://picsum.photos/300/200?4">
  </div>
</section>

<!-- REDES -->
<section id="redes">
  <h2>Redes Sociales</h2>
  <div class="socials">
    <a href="#">Facebook</a>
    <a href="#">Instagram</a>
    <a href="#">YouTube</a>
  </div>
</section>

<script>

function whatsapp(numero){
  window.open(`https://wa.me/${numero}`,'_blank');
}

function toggleMenu(){
  const menu = document.getElementById("menu");
  const overlay = document.getElementById("overlay");

  menu.classList.toggle("active");
  overlay.classList.toggle("active");

  // Bloquear scroll cuando menú está abierto
  document.body.style.overflow = menu.classList.contains("active") ? "hidden" : "auto";
}

// Animaciones scroll
const sections=document.querySelectorAll("section");
window.addEventListener("scroll",()=>{
  sections.forEach(sec=>{
    const top=sec.getBoundingClientRect().top;
    if(top<window.innerHeight-100){
      sec.classList.add("visible");
    }
  });
});

</script>

</body>
</html>
